name: Deploy Google Play
on:
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        required: true
      upload:
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      upload:
        type: boolean
        default: false
    secrets:
      GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64:
        required: false
      GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD:
        required: false
      GOOGLE_PLAY_UPLOAD_KEY_PASSWORD:
        required: false
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: android-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  google-play:
    uses: seorilabs/.github/.github/workflows/godot-deploy-google-play.yml@main
    with:
      release_tag: ${{ inputs.release_tag }}
      package_name: com.seorilabs.startergame
      upload: ${{ inputs.upload }}
      track: internal
      release_status: completed
      godot_version: '4.7.2'
      project_dir: godot
      scripts_dir: tools
    secrets:
      GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64 }}
      GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
      GOOGLE_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEY_PASSWORD }}
