name: Godot Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: godot-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: seorilabs/.github/.github/workflows/godot-checks.yml@main
    with:
      runs_on: ${{ github.event.repository.private && 'seorilabs-x64' || 'ubuntu-latest' }}
      godot_version: '4.7.2'
      project_dir: godot
      check_command: npm test && xvfb-run -a python3 tools/check.py --capture --size 568x320
      e2e_report_path: build/e2e
