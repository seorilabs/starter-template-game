name: Deploy Godot Web Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: godot-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Godot Web
    runs-on: ${{ github.event.repository.private && 'seorilabs-rpi-arm64' || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.6.3"
      GODOT_STATUS: stable

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Godot Runtime Dependencies
        shell: bash
        run: |
          set -euo pipefail

          if ldconfig -p 2>/dev/null | grep -q "libfontconfig.so.1"; then
            echo "fontconfig runtime is already available"
            exit 0
          fi

          if ! command -v apt-get >/dev/null 2>&1; then
            echo "libfontconfig.so.1 is missing and apt-get is unavailable" >&2
            exit 1
          fi

          sudo_cmd=""
          if command -v sudo >/dev/null 2>&1; then
            sudo_cmd="sudo"
          fi

          ${sudo_cmd} apt-get update
          ${sudo_cmd} apt-get install -y libfontconfig1 fontconfig

      - name: Ensure Godot
        shell: bash
        run: bash scripts/ensure_godot.sh --with-export-templates

      - name: Export Godot Web
        shell: bash
        run: bash scripts/export_godot_web.sh

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ${{ github.event.repository.private && 'seorilabs-rpi-arm64' || 'ubuntu-latest' }}
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
